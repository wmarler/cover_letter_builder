<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{CSS_HREF}}">
</head>
<body class="page-letter">

  <article class="letter-paper letter-paper--cover">

    <header class="letter-contact-header">
      <p class="letter-name">{{AUTHOR_NAME}}</p>
{{CONTACT_TABLE}}
      <hr class="letter-rule">
    </header>

    <p class="letter-date"><time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time></p>

    <div class="letter-body">
{{BODY}}
    </div>

    <footer class="letter-footer">
      <p class="letter-signoff">Best regards,</p>
      <p class="letter-signature">{{SIGNATURE}}</p>
    </footer>

  </article>

  <aside id="viewport-toast" class="attention-toast" role="status" aria-live="polite" data-min-width="{{MIN_VIEWPORT_WIDTH}}">
    <p>This page is intended to be viewed on a screen at least {{MIN_VIEWPORT_WIDTH}} pixels wide.</p>
    <button type="button" class="attention-toast-dismiss" aria-label="Dismiss">&times;</button>
  </aside>

  <script src="{{JS_HREF}}"></script>
</body>
</html>

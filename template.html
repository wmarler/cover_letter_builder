<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{LETTER_CSS_HREF}}">
  <link rel="stylesheet" href="{{CSS_HREF}}">
</head>
<body class="page-letter">

  <article class="letter-paper letter-paper--cover">

    <header class="letter-contact-header">
      <p class="letter-name">{{AUTHOR_NAME}}</p>
{{CONTACT_TABLE}}
      <hr class="letter-rule">
    </header>

    <p class="letter-date"><time datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time></p>

    <div class="letter-body">
{{BODY}}
    </div>

    <footer class="letter-footer">
      <p style="margin: 0 0 0.25rem;">Best regards,</p>
      <p class="letter-signature">{{SIGNATURE}}</p>
    </footer>

  </article>

</body>
</html>
